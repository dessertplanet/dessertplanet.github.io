baseURL = "https://dessertplanet.co/"
locale = "en-us"
title = "dessertplanet.co"
enableRobotsTXT = true

# Project repos with Pages enabled claim dessertplanet.co/<repo-name>/.
# Keep generated top-level paths clear of repo names; project pages live under /projects/.

[params]
	description = "Selected projects by Dune Desormeaux, a musician and creative technologist in Seattle."
	themeColor = "#344b3a"
	tagline = "Sound, software & experimentation"
	portrait = "/images/portrait.jpg"
	copyrightName = "Dune Desormeaux"

[[params.socials]]
	name = "GitHub"
	url = "https://github.com/dessertplanet"
[[params.socials]]
	name = "YouTube"
	url = "https://youtube.com/@dessertplanet"
[[params.socials]]
	name = "Instagram"
	url = "https://www.instagram.com/dessertplanet_"
[[params.socials]]
	name = "llllllll"
	url = "https://llllllll.co/u/dessertplanet/summary"
[[params.socials]]
	name = "LinkedIn"
	url = "https://linkedin.com/in/duned"

[[menu.main]]
	name = "GitHub"
	url = "https://github.com/dessertplanet"
	weight = 1
	[menu.main.params]
		external = true
[[menu.main]]
	name = "YouTube"
	url = "https://youtube.com/@dessertplanet"
	weight = 2
	[menu.main.params]
		external = true
[[menu.main]]
	name = "Instagram"
	url = "https://www.instagram.com/dessertplanet_"
	weight = 3
	[menu.main.params]
		external = true
[[menu.main]]
	name = "llllllll"
	url = "https://llllllll.co/u/dessertplanet/summary"
	weight = 4
	[menu.main.params]
		external = true
[[menu.main]]
	name = "LinkedIn"
	url = "https://linkedin.com/in/duned"	
	weight = 5
	[menu.main.params]
		external = true

# No feed. This was once forced -- project pages carried no date, so every RSS
# item was stamped year 0001 and readers had nothing to order them by -- but they
# carry a release date now, so turning one back on would order correctly. Left off
# as a choice. Dropping the output also drops the alternate link in head.html.
[outputs]
	home = ["html"]
	section = ["html"]

# Rendered as a pill in the footer, left of the copyright line.
# /roadmap/ is not built yet, so it 404s for now.
[[menu.actions]]
	name = "Dessert menu"
	url = "/roadmap/"
	weight = 1

[markup.goldmark.renderer]
	unsafe = true

# No taxonomy pages: `tags` in front matter are display labels, not a filterable
# taxonomy. Removing this block would generate /tags/ and /categories/ pages.
[taxonomies]
