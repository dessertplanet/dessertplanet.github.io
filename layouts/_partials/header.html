<header>
	<a class="wordmark" href="{{ "/" | relURL }}">{{ site.Title }}</a>
	<nav aria-label="Primary navigation">
		{{- range site.Menus.main }}
		{{- if .Params.external }}
		<a href="{{ .URL }}" target="_blank" rel="noreferrer">{{ .Name }} <span class="ext" aria-hidden="true">&#8599;&#xFE0E;</span></a>
		{{- else }}
		<a href="{{ .URL }}">{{ .Name }}</a>
		{{- end }}
		{{- end }}
	</nav>
</header>
