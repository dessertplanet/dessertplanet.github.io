<a class="project" href="{{ .RelPermalink }}">
	<div class="project-title">
		<h3>{{ .Title }}</h3>
		{{- with .Params.tags }}
		<div class="project-meta">{{ range . }}<span>{{ . }}</span>{{ end }}</div>
		{{- end }}
	</div>
	<div class="project-description">
		<p>{{ .Params.summary }}</p>
	</div>
	<span class="arrow" aria-hidden="true">&#8594;</span>
</a>
