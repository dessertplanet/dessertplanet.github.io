<a class="project" href="{{ .RelPermalink }}">
	<span class="project-number">{{ .Params.number }}</span>
	<h3>{{ .Title }}</h3>
	<div class="project-description">
		<p>{{ .Params.summary }}</p>
		<div class="project-meta">{{ range .Params.tags }}<span>{{ . }}</span>{{ end }}</div>
	</div>
	<span class="arrow" aria-hidden="true">&#8594;</span>
</a>
