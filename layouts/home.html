{{ define "main" }}
<main id="top">
	<section class="intro" aria-labelledby="intro-title">
		<h1 id="intro-title">{{ site.Params.tagline }}</h1>
	</section>

	<section class="about" id="about" aria-label="About">
		<div class="about-copy">
			{{ .Content }}
			<div class="portrait-frame">
				<img class="portrait" src="{{ site.Params.portrait }}" alt="Portrait of Dune Desormeaux" width="460" height="460">
			</div>
		</div>
	</section>

	<section id="work" aria-label="Selected work">
		<div class="projects">
			{{- range (where site.RegularPages "Section" "projects").ByWeight }}
			{{ partial "project-card.html" . }}
			{{- end }}
		</div>
	</section>
</main>
{{ end }}
