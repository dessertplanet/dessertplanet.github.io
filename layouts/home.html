{{ define "main" }}
<main id="top">
	<section class="intro" aria-labelledby="intro-title">
		<h1 id="intro-title">{{ site.Params.tagline }}</h1>
	</section>

	<section class="about" id="about" aria-label="About">
		<div class="about-copy">
			{{ .Content }}
			<img class="portrait" src="{{ site.Params.portrait }}" alt="Portrait of Dune Desormeaux" width="112" height="112">
		</div>
	</section>

	<section id="work" aria-labelledby="work-title">
		<div class="section-heading">
			<h2 id="work-title">Selected work</h2>
			<span>{{ site.Params.workYears | safeHTML }}</span>
		</div>

		<div class="projects">
			{{- range (where site.RegularPages "Section" "projects").ByWeight }}
			{{ partial "project-card.html" . }}
			{{- end }}
		</div>
	</section>
</main>
{{ end }}
