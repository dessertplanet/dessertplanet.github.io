{{ define "main" }}
<main>
	<section class="intro" aria-labelledby="intro-title">
		<h1 id="intro-title">{{ site.Params.tagline }}</h1>
	</section>

	<section class="about" id="about" aria-label="About">
		<div class="about-copy">
			{{ .Content }}
		</div>
	</section>

	<section id="work" aria-label="Selected work">
		<div class="projects">
			{{- range (where site.RegularPages "Section" "projects").ByWeight }}
			{{ partial "project-card.html" . }}
			{{- end }}
		</div>
	</section>
</main>
{{ end }}

{{ define "decor" }}
<div class="planet-decor" aria-hidden="true">
	<img src="{{ site.Params.portrait }}" alt="">
</div>
{{ end }}
