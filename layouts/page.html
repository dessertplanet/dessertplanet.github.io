{{ define "main" }}
<main id="top">
	<article class="detail">
		<div class="detail-head">
			<a class="back" href="{{ "/" | relURL }}">&#8592; Home</a>

			<div class="section-heading">
				<h1>{{ .Title }}</h1>
				{{- with .Params.tags }}
				<div class="project-meta detail-meta">{{ range . }}<span>{{ . }}</span>{{ end }}</div>
				{{- end }}
			</div>

			{{- with .Params.summary }}
			<p class="lede">{{ . }}</p>
			{{- end }}

			{{- with .Params.links }}
			<div class="detail-links">
				{{- range . }}
				<a href="{{ .url }}" target="_blank" rel="noreferrer">{{ .name }} <span class="ext" aria-hidden="true">&#8599;&#xFE0E;</span></a>
				{{- end }}
			</div>
			{{- end }}
		</div>

		<div class="prose">
			{{ .Content }}
		</div>
	</article>
</main>
{{ end }}
