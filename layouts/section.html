{{ define "main" }}
<main id="top">
	<section>
		<div class="section-heading">
			<h1>{{ .Title }}</h1>
			<span>{{ len .Pages }}</span>
		</div>
		<div class="prose">{{ .Content }}</div>
		<div class="projects">
			{{- range .Pages.ByWeight }}
			{{ partial "project-card.html" . }}
			{{- end }}
		</div>
	</section>
</main>
{{ end }}
